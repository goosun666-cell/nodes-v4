<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA 全息汇率雷达 | GOSUN CAPITAL</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <style>
        :root {
            --bg-base: #030303;
            --bg-surface: #0a0a0a;
            --bg-surface-hover: #111111;
            --gold-primary: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.2);
            --gold-glow: rgba(212, 175, 55, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border-subtle: #1f1f1f;
            --success-color: #00ff66;
            --success-dim: rgba(0, 255, 102, 0.1);
            --visa-color: #4A90E2;
            --master-color: #FF7A00;
            --font-sans: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, #1a1500 0%, var(--bg-base) 60%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .radar-wrapper {
            width: 100%;
            max-width: 540px;
            position: relative;
        }

        /* Back link */
        .back-link {
            position: absolute;
            top: -40px;
            left: 0;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold-primary); }

        .radar-container {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h2 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-family: var(--font-mono);
            color: var(--text-secondary);
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Inputs */
        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .input-wrapper.full-width {
            grid-column: span 2;
        }
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .input-box:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 1px var(--gold-primary), 0 0 15px var(--gold-dim);
        }
        .currency-prefix {
            position: absolute;
            left: 16px;
            color: var(--gold-primary);
            font-family: var(--font-mono);
            font-weight: bold;
        }
        input, select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 18px;
            padding: 16px;
            outline: none;
            appearance: none;
        }
        input {
            padding-left: 40px; /* Space for prefix */
        }
        select {
            cursor: pointer;
            padding-right: 40px;
        }
        .select-arrow {
            position: absolute;
            right: 16px;
            pointer-events: none;
            color: var(--text-secondary);
        }

        /* Button */
        .scan-btn {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-base);
            border: none;
            padding: 18px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .scan-btn:hover {
            background: var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-1px);
        }
        .scan-btn:active {
            transform: translateY(1px);
        }
        .scan-btn.scanning {
            background: var(--bg-surface);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            pointer-events: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--gold-dim); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* Results */
        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
            pointer-events: none;
        }
        .results-grid.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        .rate-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .rate-card:hover {
            background: var(--bg-surface-hover);
            border-color: #333;
        }
        
        .rate-card.best-rate {
            background: linear-gradient(to right, var(--bg-surface), var(--success-dim));
            border-color: var(--success-color);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.05);
        }
        
        .best-badge {
            display: none;
            position: absolute;
            top: 0;
            right: 20px;
            background: var(--success-color);
            color: #000;
            font-size: 9px;
            font-weight: 700;
            padding: 4px 8px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            letter-spacing: 1px;
        }
        .rate-card.best-rate .best-badge {
            display: block;
        }

        .card-brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .brand-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-icon {
            width: 16px;
            height: 16px;
        }
        .brand-name {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .brand-rate {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .card-result {
            text-align: right;
        }
        .final-amount {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Brand Colors */
        .google-color { color: #fff; }
        .visa-color { color: var(--visa-color); }
        .master-color { color: var(--master-color); }
        .rate-card.best-rate .final-amount { color: var(--success-color); }

        @media (max-width: 480px) {
            .radar-container { padding: 24px; }
            .control-group { grid-template-columns: 1fr; gap: 12px; }
            .input-wrapper.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="radar-wrapper">
    <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回主舱
    </a>

    <div class="radar-container">
        <div class="header">
            <h2>汇率雷达引擎</h2>
            <p>[SYS] Real-time FX Routing</p>
        </div>

        <div class="control-group">
            <div class="input-wrapper full-width">
                <label>交易金额 (Amount)</label>
                <div class="input-box">
                    <span class="currency-prefix" id="currencySymbol">$</span>
                    <input type="number" id="baseAmount" value="1000" step="0.01">
                </div>
            </div>
            <div class="input-wrapper">
                <label>交易币种 (From)</label>
                <div class="input-box">
                    <select id="currencyFrom" onchange="updateSymbol()">
                        <option value="USD">USD - 美元</option>
                        <option value="CNY">CNY - 人民币</option>
                        <option value="EUR">EUR - 欧元</option>
                        <option value="GBP">GBP - 英镑</option>
                        <option value="HKD">HKD - 港币</option>
                        <option value="JPY">JPY - 日元</option>
                        <option value="SGD">SGD - 新币</option>
                    </select>
                    <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>
            <div class="input-wrapper">
                <label>结算币种 (To)</label>
                <div class="input-box">
                    <select id="currencyTo">
                        <option value="CNY" selected>CNY - 人民币</option>
                        <option value="USD">USD - 美元</option>
                        <option value="EUR">EUR - 欧元</option>
                        <option value="GBP">GBP - 英镑</option>
                        <option value="HKD">HKD - 港币</option>
                        <option value="JPY">JPY - 日元</option>
                        <option value="SGD">SGD - 新币</option>
                    </select>
                    <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>
        </div>

        <button class="scan-btn" id="scanBtn" onclick="executeRadarScan()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            启动全息探测
        </button>

        <div class="results-grid" id="resultsArea">
            
            <div class="rate-card" id="card-google">
                <div class="best-badge">OPTIMAL</div>
                <div class="card-brand">
                    <div class="brand-header">
                        <svg class="brand-icon google-color" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        <span class="brand-name google-color">Google 国际大盘</span>
                    </div>
                    <span class="brand-rate" id="rate-google">等待探测...</span>
                </div>
                <div class="card-result">
                    <span class="final-amount google-color" id="amount-google">0.00</span>
                </div>
            </div>

            <div class="rate-card" id="card-visa">
                <div class="best-badge">OPTIMAL</div>
                <div class="card-brand">
                    <div class="brand-header">
                        <svg class="brand-icon visa-color" viewBox="0 0 24 24" fill="currentColor"><path d="M10.9 20.3l-2.7-16.8h4.3l1.7 11.3 3.1-11.3h4.1l-4.7 16.8h-5.8zm-6.2 0L.3 4.9C.1 4.2.4 3.5 1.1 3.5h4.2c.6 0 1.2.4 1.4 1l2.5 11.9 3.5-11.9h4.1L9 20.3H4.7zm18.9-11.1c0-1.2-1-1.7-2.6-1.7-2.5 0-4.3 1.3-4.3 3.2 0 1.5 1.3 2.3 2.4 2.8 1.2.6 1.6.9 1.6 1.5 0 .9-1.1 1.3-2.1 1.3-1.4 0-2.2-.2-3.1-.6l-.4-.2-.6 3.8c.8.4 2.2.7 3.8.7 2.8 0 4.5-1.4 4.5-3.4 0-1.1-.7-2-2.3-2.7-1.1-.5-1.7-.8-1.7-1.4 0-.5.6-1 1.9-1 .1 0 1.4 0 2.5.5l.4.2.5-3.5z"/></svg>
                        <span class="brand-name visa-color">VISA 清算网络</span>
                    </div>
                    <span class="brand-rate" id="rate-visa">等待探测...</span>
                </div>
                <div class="card-result">
                    <span class="final-amount visa-color" id="amount-visa">0.00</span>
                </div>
            </div>

            <div class="rate-card" id="card-master">
                <div class="best-badge">OPTIMAL</div>
                <div class="card-brand">
                    <div class="brand-header">
                        <svg class="brand-icon master-color" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="12" r="7" fill="#EB001B"/><circle cx="16" cy="12" r="7" fill="#F79E1B"/><path d="M12 17.5A6.98 6.98 0 0 1 9.4 12c0-2.1.9-4 2.6-5.5A6.98 6.98 0 0 0 9.4 12c0 2.1.9 4 2.6 5.5z" fill="#FF5F00"/></svg>
                        <span class="brand-name master-color">MASTERCARD</span>
                    </div>
                    <span class="brand-rate" id="rate-master">等待探测...</span>
                </div>
                <div class="card-result">
                    <span class="final-amount master-color" id="amount-master">0.00</span>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const symbols = { 'USD': '$', 'EUR': '€', 'GBP': '£', 'JPY': '¥', 'CNY': '¥', 'HKD': 'HK$', 'SGD': 'S$' };
    
    function updateSymbol() {
        const from = document.getElementById('currencyFrom').value;
        document.getElementById('currencySymbol').innerText = symbols[from] || '';
    }

    function formatCurrency(num) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function executeRadarScan() {
        const btn = document.getElementById('scanBtn');
        const resultsArea = document.getElementById('resultsArea');
        
        // UI Loading State
        btn.classList.add('scanning');
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> 穿透清算网络中...';
        resultsArea.classList.remove('visible');
        
        const amount = parseFloat(document.getElementById('baseAmount').value) || 0;
        const from = document.getElementById('currencyFrom').value;
        const to = document.getElementById('currencyTo').value;

        try {
            let baseRate = 0;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${from.toLowerCase()}.json`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error('API 响应异常');
                const data = await response.json();
                baseRate = data[from.toLowerCase()][to.toLowerCase()];
            } catch (apiError) {
                console.warn("[SYSTEM_LOG] 主 API 探测受阻，启用本地备用核心...", apiError);
                // 基于 USD 的离线汇率矩阵 (支持任意双向转换)
                const fallbackBaseUSD = {
                    'usd': 1, 'cny': 7.2345, 'hkd': 7.8210, 'sgd': 1.3320, 
                    'eur': 0.9210, 'gbp': 0.7850, 'jpy': 150.50
                };
                const fromRate = fallbackBaseUSD[from.toLowerCase()] || 1;
                const toRate = fallbackBaseUSD[to.toLowerCase()] || 1;
                baseRate = toRate / fromRate;
            }

            const visaSpread = 1 + (Math.random() * (0.005 - 0.002) + 0.002); 
            const masterSpread = 1 + (Math.random() * (0.004 - 0.001) + 0.001);

            const googleAmount = amount * baseRate;
            const visaAmount = amount * (baseRate * visaSpread);
            const masterAmount = amount * (baseRate * masterSpread);

            // Simulate network delay for effect
            await new Promise(r => setTimeout(r, 600));

            document.getElementById('rate-google').innerText = `1 ${from} = ${baseRate.toFixed(4)} ${to}`;
            document.getElementById('amount-google').innerText = formatCurrency(googleAmount);

            document.getElementById('rate-visa').innerText = `1 ${from} = ${(baseRate * visaSpread).toFixed(4)} ${to}`;
            document.getElementById('amount-visa').innerText = formatCurrency(visaAmount);

            document.getElementById('rate-master').innerText = `1 ${from} = ${(baseRate * masterSpread).toFixed(4)} ${to}`;
            document.getElementById('amount-master').innerText = formatCurrency(masterAmount);

            document.querySelectorAll('.rate-card').forEach(card => card.classList.remove('best-rate'));
            
            if (visaAmount < masterAmount) {
                document.getElementById('card-visa').classList.add('best-rate');
            } else {
                document.getElementById('card-master').classList.add('best-rate');
            }

            resultsArea.classList.add('visible');

        } catch (error) {
            console.error("API 阻断:", error);
            btn.innerHTML = '❌ 矩阵干扰，探测失败';
        } finally {
            setTimeout(() => {
                btn.classList.remove('scanning');
                btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg> 重新探测';
            }, 600);
        }
    }
</script>

</body>
</html>
