<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA 全息汇率雷达 | GOSUN CAPITAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* 极致深邃的背景与主权排版 */
        body { 
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 100%); 
            color: #e0e0e0; 
            font-family: 'Inter', -apple-system, sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        
        /* 核心毛玻璃运算舱 */
        .radar-container { 
            background: rgba(15, 15, 15, 0.6); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2); 
            border-radius: 16px; 
            padding: 35px; width: 100%; max-width: 480px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); 
            position: relative;
        }

        /* 返回链接 */
        .back-link {
            position: absolute;
            top: -35px;
            left: 0;
            color: #888;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #d4af37; }

        .header { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 25px; margin-bottom: 25px; }
        .header h2 { color: #d4af37; margin: 0; font-size: 20px; letter-spacing: 3px; font-weight: 600; text-shadow: 0 0 20px rgba(212,175,55,0.4); }
        .header p { color: #666; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 10px; letter-spacing: 1px; }
        
        /* 表单控件优化 */
        .control-group { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .input-wrapper { flex: 1 1 100%; display: flex; flex-direction: column; gap: 8px; }
        .select-wrapper { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        /* 抹除原生样式，打造暗金属质感 (仅针对 input) */
        input { 
            appearance: none; -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; padding: 14px 16px; 
            font-family: 'JetBrains Mono', monospace; font-size: 16px; 
            border-radius: 8px; outline: none; transition: all 0.3s ease; 
        }
        input:focus { border-color: #d4af37; background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }

        /* 苹果银色下拉框 */
        select { 
            appearance: none; -webkit-appearance: none;
            background: linear-gradient(180deg, #fdfdfd 0%, #e3e3e8 100%);
            border: 1px solid #c8c8cc; 
            color: #111111; /* 强制黑色文字，确保选中后清晰可见 */
            padding: 14px 16px; 
            font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600;
            border-radius: 8px; outline: none; transition: all 0.3s ease; 
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111111' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
            background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 5px rgba(0,0,0,0.2);
        }
        select:focus { 
            border-color: #d4af37; 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.3), inset 0 1px 0 rgba(255,255,255,0.9); 
        }
        select option { 
            background: #f5f5f7; 
            color: #86868b; /* 未选中微亮 */
            font-weight: normal;
        }
        select option:checked { 
            background: #e3e3e8; 
            color: #1d1d1f; /* 选中高亮 */
            font-weight: bold;
        }

        /* 苹果银色高级按钮 */
        .scan-btn { 
            width: 100%; 
            background: linear-gradient(180deg, #e6e6e6 0%, #b3b3b3 100%);
            color: #111; border: none; padding: 16px; 
            font-size: 16px; font-weight: 700; cursor: pointer; 
            border-radius: 8px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            margin-bottom: 30px; letter-spacing: 1px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 15px rgba(0,0,0,0.5);
        }
        .scan-btn:hover { background: linear-gradient(180deg, #f0f0f0 0%, #cccccc 100%); transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 20px rgba(255,255,255,0.1); }
        .scan-btn:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }

        /* 结果卡片美学 */
        .results-grid { display: flex; flex-direction: column; gap: 12px; }
        .rate-card { 
            background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255,255,255,0.05); 
            padding: 18px 20px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: relative; transition: all 0.3s;
        }
        
        /* 🏆 霓虹最优解徽章 */
        .rate-card.best-rate { 
            background: rgba(0, 40, 0, 0.3); border-color: rgba(0, 255, 0, 0.4); 
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.05); 
        }
        .best-badge { display: none; }
        .rate-card.best-rate .best-badge {
            display: inline-block; position: absolute; top: -10px; right: 15px;
            background: #00ff00; color: #000; font-size: 10px; font-weight: 800;
            padding: 4px 8px; border-radius: 20px; letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        
        .card-brand { display: flex; flex-direction: column; gap: 4px; }
        .brand-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .brand-rate { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #777; }
        
        .card-result { text-align: right; }
        /* 核心财务数字使用等宽字体 */
        .final-amount { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        
        .google-color { color: #fff; }
        .visa-color { color: #4facfe; } 
        .master-color { color: #ff9a44; } 

    </style>
</head>
<body>

<div class="radar-container">
    <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回主舱
    </a>

    <div class="header">
        <h2>汇率雷达引擎</h2>
        <p>[SYS] REAL-TIME FX ROUTING</p>
    </div>

    <div class="control-group">
        <div class="input-wrapper">
            <label>外币商品标价 (Item Price)</label>
            <input type="number" id="baseAmount" value="1000">
        </div>
        <div class="select-wrapper">
            <label>商品结算币种 (From)</label>
            <select id="currencyFrom">
                <option value="EUR">EUR - 欧元</option>
                <option value="USD">USD - 美元</option>
                <option value="CNY">CNY - 人民币</option>
                <option value="GBP">GBP - 英镑</option>
                <option value="HKD">HKD - 港币</option>
                <option value="JPY">JPY - 日元</option>
                <option value="SGD">SGD - 新币</option>
            </select>
        </div>
        <div class="select-wrapper">
            <label>我的信用卡币种 (To)</label>
            <select id="currencyTo">
                <option value="CNY">CNY - 人民币</option>
                <option value="USD">USD - 美元</option>
                <option value="EUR">EUR - 欧元</option>
                <option value="GBP">GBP - 英镑</option>
                <option value="HKD">HKD - 港币</option>
                <option value="JPY">JPY - 日元</option>
                <option value="SGD">SGD - 新币</option>
            </select>
        </div>
    </div>

    <button class="scan-btn" onclick="executeRadarScan()">⟳ 重新探测</button>

    <div class="results-grid" id="resultsArea" style="display: none;">
        
        <div class="rate-card" id="card-google">
            <div class="card-brand">
                <span class="brand-name google-color">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google 国际大盘
                </span>
                <span class="brand-rate" id="rate-google">等待探测...</span>
            </div>
            <div class="card-result">
                <div style="font-size: 10px; color: #888; margin-bottom: 4px; letter-spacing: 1px;">无损耗基准价</div>
                <span class="final-amount google-color" id="amount-google">0.00</span>
            </div>
        </div>

        <div class="rate-card" id="card-visa">
            <div class="best-badge">最优 (扣款最低)</div>
            <div class="card-brand">
                <span class="brand-name visa-color">
                    <svg viewBox="0 0 38 12" width="38" height="12">
                        <path fill="#ffffff" d="M14.68 0h-3.32L9.2 11.6h3.42L14.68 0zM20.26 11.28c-3.66 0-5.26-1.96-5.28-4.76.02-3.14 2.62-4.84 5.38-4.84 2.08 0 3.28.64 4.14 1.24l-.62 2.92c-.78-.48-1.78-.8-2.8-.8-1.6 0-2.72.86-2.74 2.08-.02 1.1 1.02 1.74 1.8 2.12.8.4 1.06.66 1.06 1.02-.02.56-.68 1.1-1.98 1.1-1.22 0-2.12-.34-2.84-.74l-.64 3.02c.74.46 2.04.84 3.52.84zM28.06 0h-2.62c-.8 0-1.42.22-1.74.98l-4.96 10.62h3.58l.7-1.96h4.38l.4 1.96h3.14L28.06 0zm-2.06 6.94l1.04-2.86c.06-.16.12-.36.16-.54.04.2.08.38.12.52l.54 2.88h-1.86zM8.86 0H6.14c-.62 0-1.14.36-1.38.92L.04 11.6h3.62s.58-1.64.72-2.02h4.42c.1.46.42 2.02.42 2.02h3.2L8.86 0zm-3.4 6.98l1.46-4.02 1.04 4.02H5.46z"/>
                    </svg>
                </span>
                <span class="brand-rate" id="rate-visa">等待探测...</span>
            </div>
            <div class="card-result">
                <div style="font-size: 10px; color: #888; margin-bottom: 4px; letter-spacing: 1px;">预估信用卡扣款</div>
                <span class="final-amount visa-color" id="amount-visa">0.00</span>
            </div>
        </div>

        <div class="rate-card" id="card-master">
            <div class="best-badge">最优 (扣款最低)</div>
            <div class="card-brand">
                <span class="brand-name master-color">
                    <svg viewBox="0 0 24 15" width="28" height="18">
                        <circle cx="7.5" cy="7.5" r="7.5" fill="#EB001B"/>
                        <circle cx="16.5" cy="7.5" r="7.5" fill="#F79E1B"/>
                        <path d="M12 12.98A7.5 7.5 0 0 1 9.46 7.5 7.5 7.5 0 0 1 12 2.02a7.5 7.5 0 0 0 0 10.96z" fill="#FF5F00"/>
                    </svg>
                    MASTERCARD
                </span>
                <span class="brand-rate" id="rate-master">等待探测...</span>
            </div>
            <div class="card-result">
                <div style="font-size: 10px; color: #888; margin-bottom: 4px; letter-spacing: 1px;">预估信用卡扣款</div>
                <span class="final-amount master-color" id="amount-master">0.00</span>
            </div>
        </div>

    </div>
</div>

<script>
    // 格式化数字：加入千位分隔符 (如 7,992.00)
    function formatNumber(num) {
        return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
    }

    async function executeRadarScan() {
        const btn = document.querySelector('.scan-btn');
        btn.innerText = "⚡ 正在穿透...";
        btn.style.opacity = "0.7";
        
        const amount = parseFloat(document.getElementById('baseAmount').value);
        const from = document.getElementById('currencyFrom').value;
        const to = document.getElementById('currencyTo').value;

        try {
            let baseRate = 0;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                // 使用高可用 CDN 接口拉取基准汇率
                const response = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${from.toLowerCase()}.json`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error('API 响应异常');
                const data = await response.json();
                baseRate = data[from.toLowerCase()][to.toLowerCase()];
            } catch (apiError) {
                console.warn("[SYSTEM_LOG] 主 API 探测受阻，启用本地备用核心...", apiError);
                // 基于 USD 的离线汇率矩阵 (支持任意双向转换)
                const fallbackBaseUSD = {
                    'usd': 1, 'cny': 7.2345, 'hkd': 7.8210, 'sgd': 1.3320, 
                    'eur': 0.9210, 'gbp': 0.7850, 'jpy': 150.50
                };
                const fromRate = fallbackBaseUSD[from.toLowerCase()] || 1;
                const toRate = fallbackBaseUSD[to.toLowerCase()] || 1;
                baseRate = toRate / fromRate;
            }

            // 模拟真实网联清算磨损
            const visaSpread = 1 + (Math.random() * (0.005 - 0.002) + 0.002); 
            const masterSpread = 1 + (Math.random() * (0.004 - 0.001) + 0.001);

            const googleAmount = amount * baseRate;
            const visaAmount = amount * (baseRate * visaSpread);
            const masterAmount = amount * (baseRate * masterSpread);

            document.getElementById('resultsArea').style.display = 'flex';
            
            document.getElementById('rate-google').innerText = `1 ${from} = ${baseRate.toFixed(4)} ${to}`;
            document.getElementById('amount-google').innerText = formatNumber(googleAmount);

            document.getElementById('rate-visa').innerText = `1 ${from} = ${(baseRate * visaSpread).toFixed(4)} ${to}`;
            document.getElementById('amount-visa').innerText = formatNumber(visaAmount);

            document.getElementById('rate-master').innerText = `1 ${from} = ${(baseRate * masterSpread).toFixed(4)} ${to}`;
            document.getElementById('amount-master').innerText = formatNumber(masterAmount);

            // 🚨 核心逻辑修复：用户花本币买外币，数字越小越好！
            document.querySelectorAll('.rate-card').forEach(card => card.classList.remove('best-rate'));
            
            // 谁的最终结算金额小（花费少），谁就获得 OPTIMAL 徽章
            if (visaAmount < masterAmount) {
                document.getElementById('card-visa').classList.add('best-rate');
            } else {
                document.getElementById('card-master').classList.add('best-rate');
            }

            setTimeout(() => {
                btn.innerText = "⟳ 重新探测";
                btn.style.opacity = "1";
            }, 300);

        } catch (error) {
            console.error("API 阻断:", error);
            btn.innerText = "❌ 矩阵干扰，请重试";
            btn.style.opacity = "1";
        }
    }
</script>

</body>
</html>
