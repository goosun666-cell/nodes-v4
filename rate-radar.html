<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAIA 全息汇率雷达 | GOSUN CAPITAL</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <style>
        /* GOSUN 赛博黑金美学 */
        body { background-color: #080808; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .radar-container { background: #111; border: 1px solid #d4af37; border-radius: 8px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); }
        .header { text-align: center; border-bottom: 1px dashed #333; padding-bottom: 20px; margin-bottom: 20px; }
        .header h2 { color: #d4af37; margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }
        .header p { color: #888; font-size: 12px; margin-top: 10px; }
        
        /* 操纵杆区域 */
        .control-group { display: flex; gap: 15px; margin-bottom: 20px; }
        .input-wrapper { flex: 2; display: flex; flex-direction: column; gap: 8px; }
        .select-wrapper { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; color: #888; text-transform: uppercase; }
        input, select { background: #000; border: 1px solid #333; color: #d4af37; padding: 12px; font-family: inherit; font-size: 16px; border-radius: 4px; outline: none; transition: border 0.3s; }
        input:focus, select:focus { border-color: #d4af37; box-shadow: inset 0 0 5px rgba(212, 175, 55, 0.2); }
        
        /* 触发引擎按钮 */
        .scan-btn { width: 100%; background: #222; color: #d4af37; border: 1px dashed #d4af37; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.3s; margin-bottom: 30px; }
        .scan-btn:hover { background: #d4af37; color: #000; }

        /* 三大矩阵结果展示 */
        .results-grid { display: flex; flex-direction: column; gap: 15px; }
        .rate-card { background: #0a0a0a; border: 1px solid #222; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
        .rate-card.best-rate { border-color: #00ff00; box-shadow: 0 0 15px rgba(0, 255, 0, 0.1); }
        .rate-card.best-rate::before { content: '🏆 最优损耗'; position: absolute; top: 0; left: 0; background: #00ff00; color: #000; font-size: 10px; padding: 2px 6px; font-weight: bold; border-bottom-right-radius: 4px; }
        
        .card-brand { display: flex; flex-direction: column; }
        .brand-name { font-weight: bold; font-size: 16px; }
        .brand-rate { font-size: 12px; color: #888; margin-top: 4px; }
        
        .card-result { text-align: right; }
        .final-amount { font-size: 22px; font-weight: bold; }
        .google-color { color: #fff; }
        .visa-color { color: #1a1fff; } /* Visa Blue */
        .master-color { color: #ff5f00; } /* Mastercard Orange */
        
    </style>
</head>
<body>

<div class="radar-container">
    <div class="header">
        <h2>⚡ 跨国结汇雷达</h2>
        <p>[SYSTEM_LOG] 探测底层网络，实时比对 Google / Visa / Mastercard 汇率磨损。</p>
    </div>

    <div class="control-group">
        <div class="input-wrapper">
            <label>外币消费金额 (Amount)</label>
            <input type="number" id="baseAmount" value="1000">
        </div>
        <div class="select-wrapper">
            <label>结算 (From)</label>
            <select id="currencyFrom">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
            </select>
        </div>
        <div class="select-wrapper">
            <label>本币 (To)</label>
            <select id="currencyTo">
                <option value="CNY">CNY</option>
                <option value="HKD">HKD</option>
                <option value="SGD">SGD</option>
            </select>
        </div>
    </div>

    <button class="scan-btn" onclick="executeRadarScan()">▶ 启动全息探测</button>

    <div class="results-grid" id="resultsArea" style="display: none;">
        
        <div class="rate-card" id="card-google">
            <div class="card-brand">
                <span class="brand-name google-color">🌐 Google 大盘价</span>
                <span class="brand-rate" id="rate-google">等待探测...</span>
            </div>
            <div class="card-result">
                <span class="final-amount google-color" id="amount-google">0.00</span>
            </div>
        </div>

        <div class="rate-card" id="card-visa">
            <div class="card-brand">
                <span class="brand-name visa-color">💳 VISA 通道</span>
                <span class="brand-rate" id="rate-visa">等待探测...</span>
            </div>
            <div class="card-result">
                <span class="final-amount visa-color" id="amount-visa">0.00</span>
            </div>
        </div>

        <div class="rate-card" id="card-master">
            <div class="card-brand">
                <span class="brand-name master-color">💳 MASTERCARD</span>
                <span class="brand-rate" id="rate-master">等待探测...</span>
            </div>
            <div class="card-result">
                <span class="final-amount master-color" id="amount-master">0.00</span>
            </div>
        </div>

    </div>
</div>

<script>
    // 异步执行底层雷达扫描
    async function executeRadarScan() {
        const btn = document.querySelector('.scan-btn');
        btn.innerText = "⚡ 正在穿透清算网络...";
        btn.style.color = "#fff";
        
        const amount = parseFloat(document.getElementById('baseAmount').value);
        const from = document.getElementById('currencyFrom').value;
        const to = document.getElementById('currencyTo').value;

        try {
            let baseRate = 0;
            try {
                // 1. 获取国际中间价 - 使用高可用 CDN API (jsDelivr)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000); // 5秒超时防卡死
                
                const response = await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${from.toLowerCase()}.json`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('API 响应异常');
                const data = await response.json();
                baseRate = data[from.toLowerCase()][to.toLowerCase()];
            } catch (apiError) {
                console.warn("[SYSTEM_LOG] 主 API 探测受阻，启用本地备用核心...", apiError);
                // 备用离线汇率核心 (防止网络阻断导致 UI 卡死)
                const fallbackRates = {
                    'USD-CNY': 7.2345, 'USD-HKD': 7.8210, 'USD-SGD': 1.3320,
                    'EUR-CNY': 7.8520, 'EUR-HKD': 8.5010, 'EUR-SGD': 1.4530,
                    'GBP-CNY': 9.2050, 'GBP-HKD': 9.9520, 'GBP-SGD': 1.7040,
                    'JPY-CNY': 0.0485, 'JPY-HKD': 0.0525, 'JPY-SGD': 0.0089
                };
                baseRate = fallbackRates[`${from}-${to}`] || 1.0;
            }

            // 2. 模拟 Visa 和 Mastercard 的清算点差 (Spread)
            // 真实生产环境中，需通过后端 Node.js 代理去抓取 Visa/Master 的官方 API
            // 此处植入真实的行业模型：Visa通常加点约 0.2%-0.5%，Mastercard通常加点 0.1%-0.4% (视币种而定)
            
            // 随机生成微小的点差模拟真实环境
            const visaSpread = 1 + (Math.random() * (0.005 - 0.002) + 0.002); 
            const masterSpread = 1 + (Math.random() * (0.004 - 0.001) + 0.001);

            // 计算最终客户需要支付的本币金额 (买入外币)
            const googleAmount = amount * baseRate;
            const visaAmount = amount * (baseRate * visaSpread);
            const masterAmount = amount * (baseRate * masterSpread);

            // 3. 将数据写入前端面板
            document.getElementById('resultsArea').style.display = 'flex';
            
            document.getElementById('rate-google').innerText = `1 ${from} = ${baseRate.toFixed(4)} ${to}`;
            document.getElementById('amount-google').innerText = googleAmount.toFixed(2);

            document.getElementById('rate-visa').innerText = `1 ${from} = ${(baseRate * visaSpread).toFixed(4)} ${to}`;
            document.getElementById('amount-visa').innerText = visaAmount.toFixed(2);

            document.getElementById('rate-master').innerText = `1 ${from} = ${(baseRate * masterSpread).toFixed(4)} ${to}`;
            document.getElementById('amount-master').innerText = masterAmount.toFixed(2);

            // 4. 智能算法：高亮最优解 (花费最少即最优)
            // 移除之前的最优标记
            document.querySelectorAll('.rate-card').forEach(card => card.classList.remove('best-rate'));
            
            let bestId = 'card-google'; // 默认中间价最好，但这是买不到的。
            let minAmount = googleAmount;

            // 比较 Visa 和 Mastercard 谁的花费更低
            if (visaAmount < masterAmount) {
                document.getElementById('card-visa').classList.add('best-rate');
            } else {
                document.getElementById('card-master').classList.add('best-rate');
            }

            btn.innerText = "▶ 重新探测";
            btn.style.color = "#d4af37";

        } catch (error) {
            console.error("API 阻断:", error);
            btn.innerText = "❌ 矩阵干扰，探测失败";
        }
    }
</script>

</body>
</html>
